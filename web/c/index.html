<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Save Contact</title>
<!--
  NFC Doctor contact page. A contact-card tag written by the app links here with the contact
  in the URL fragment (after #), which browsers never send to the server. This page reads it,
  builds a vCard in the browser and hands it to the phone's Contacts. Nothing is stored.

  Fragment keys (keep in sync with src/lib/vcard.ts): f given name, l family name,
  o organisation, t phone, e email. Values are percent-encoded; "+" is a literal plus.
-->
<style>
  :root {
    --bg: #e9e8fd;
    --surface: #ffffff;
    --sunk: #f3f2fe;
    --ink: #1d1b3a;
    --muted: #625f86;
    --violet: #6a4ff6;
    --violet-ink: #5236e0;
    --on-violet: #ffffff;
    --line: rgba(29, 27, 58, 0.1);
    --shadow: 0 10px 30px rgba(82, 54, 224, 0.12), 0 2px 6px rgba(29, 27, 58, 0.06);
    --button-shadow: 0 8px 20px rgba(106, 79, 246, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15142a;
      --surface: #221f3f;
      --sunk: #1b1934;
      --ink: #f1f0ff;
      --muted: #aeaad6;
      --violet: #7d66ff;
      --violet-ink: #b3a6ff;
      --line: rgba(241, 240, 255, 0.12);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      --button-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15142a;
    --surface: #221f3f;
    --sunk: #1b1934;
    --ink: #f1f0ff;
    --muted: #aeaad6;
    --violet: #7d66ff;
    --violet-ink: #b3a6ff;
    --line: rgba(241, 240, 255, 0.12);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    --button-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 -3px 0 rgba(0, 0, 0, 0.2);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; margin: auto 0; }
  .card {
    background: var(--surface);
    border-radius: 28px;
    box-shadow: var(--shadow);
    padding: 28px 22px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
  }
  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: var(--sunk);
    color: var(--violet-ink);
    display: grid;
    place-items: center;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 750; overflow-wrap: anywhere; }
  .org { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
  .rows { width: 100%; margin: 18px 0 4px; padding: 0; list-style: none; text-align: left; }
  .rows li + li { border-top: 1px solid var(--line); }
  .rows a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 4px;
    min-height: 56px;
    color: inherit;
    text-decoration: none;
  }
  .rows svg { flex: none; width: 22px; height: 22px; stroke: var(--violet-ink); }
  .rows .label { display: block; font-size: 13px; color: var(--muted); }
  .rows .value { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .save {
    appearance: none;
    border: 0;
    width: 100%;
    min-height: 58px;
    border-radius: 20px;
    background: var(--violet);
    color: var(--on-violet);
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    box-shadow: var(--button-shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    margin-top: 14px;
  }
  .save:active { transform: translateY(1px); }
  .save svg { width: 22px; height: 22px; stroke: currentColor; }
  .hint { margin: 10px 0 0; font-size: 14px; color: var(--muted); min-height: 1.45em; }
  .note { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }
  .empty h1 { font-size: 22px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section class="card" id="card" hidden>
    <div class="avatar" id="initials" aria-hidden="true"></div>
    <h1 id="name"></h1>
    <p class="org" id="org" hidden></p>
    <ul class="rows" id="rows"></ul>
    <button class="save" id="save" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 20a7 7 0 0 1 12.5-4.3"/><path d="M19 14v6"/><path d="M16 17h6"/></svg>
      Save contact
    </button>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
  </section>

  <section class="card empty" id="empty" hidden>
    <h1>No contact in this link</h1>
    <p class="org">The link from the tag looks incomplete. Tap the tag again, or ask its owner to rewrite it.</p>
  </section>

  <p class="note">Shared from an NFC tag. The contact is stored in the link itself, not on a server.</p>
</main>

<script>
(function () {
  'use strict';

  var KEYS = { f: 'givenName', l: 'familyName', o: 'organisation', t: 'phone', e: 'email' };

  function readFragment() {
    var out = {};
    var hash = location.hash.replace(/^#/, '');
    hash.split('&').forEach(function (pair) {
      var eq = pair.indexOf('=');
      if (eq === -1) return;
      var key = KEYS[pair.slice(0, eq)];
      if (!key) return;
      var raw = pair.slice(eq + 1);
      try { out[key] = decodeURIComponent(raw).trim(); } catch (e) { out[key] = raw.trim(); }
    });
    return out;
  }

  function fullName(c) {
    return [c.givenName, c.familyName].filter(Boolean).join(' ');
  }

  // vCard 3.0 text escaping (RFC 2426): backslash, comma, semicolon, newline.
  function esc(value) {
    return String(value || '').replace(/[\\,;]/g, function (ch) { return '\\' + ch; }).replace(/\r?\n/g, '\\n');
  }

  function buildVcard(c) {
    var lines = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:' + esc(c.familyName) + ';' + esc(c.givenName) + ';;;',
      'FN:' + esc(fullName(c) || c.organisation || c.phone || c.email)
    ];
    if (c.organisation) lines.push('ORG:' + esc(c.organisation));
    if (c.phone) lines.push('TEL;TYPE=CELL:' + c.phone.replace(/[^\d+*#]/g, ''));
    if (c.email) lines.push('EMAIL;TYPE=INTERNET:' + esc(c.email));
    lines.push('END:VCARD');
    return lines.join('\r\n') + '\r\n';
  }

  function fileName(c) {
    var base = (fullName(c) || c.organisation || 'contact').replace(/[\\/:*?"<>|]+/g, '').replace(/[.\s]+$/, '').trim() || 'contact';
    return base + '.vcf';
  }

  var ICONS = {
    phone: '<rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 18h3"/>',
    email: '<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/>'
  };

  function row(kind, label, value, href) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = href;
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[kind] + '</svg>';
    var text = document.createElement('span');
    var l = document.createElement('span');
    l.className = 'label';
    l.textContent = label;
    var v = document.createElement('span');
    v.className = 'value';
    v.textContent = value;
    text.appendChild(l);
    text.appendChild(v);
    a.appendChild(text);
    li.appendChild(a);
    return li;
  }

  var ua = navigator.userAgent;
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);

  // A Blob download works in Safari and Chrome on iPhone (which show the contact sheet) and in
  // Chrome on Android (which downloads the file for Contacts to open). Navigating to the Blob,
  // data: URLs and the Web Share API are each blocked or unreliable on one of them.
  function save(c, hint) {
    var blob = new Blob([buildVcard(c)], { type: 'text/vcard;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = fileName(c);
    document.body.appendChild(a);
    a.click();
    a.remove();
    // Revoking straight away cancels the download in WebKit (bug 211234).
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);

    hint.textContent = isIOS
      ? 'Tap Create New Contact. You may need to scroll down. Done closes it without saving.'
      : isAndroid
        ? 'Open the downloaded file and choose Contacts to save it.'
        : 'Open the downloaded file to add it to your contacts.';
  }

  var c = readFragment();
  var name = fullName(c);
  if (!name && !c.organisation && !c.phone && !c.email) {
    document.getElementById('empty').hidden = false;
    return;
  }

  document.title = (name || c.organisation || 'Contact') + ' · Save Contact';
  document.getElementById('card').hidden = false;
  document.getElementById('name').textContent = name || c.organisation || c.phone || c.email;
  var initials = [c.givenName, c.familyName].filter(Boolean).map(function (p) { return Array.from(p)[0]; }).join('').toUpperCase();
  document.getElementById('initials').textContent = initials || '•';
  if (c.organisation && name) {
    var org = document.getElementById('org');
    org.textContent = c.organisation;
    org.hidden = false;
  }

  var rows = document.getElementById('rows');
  if (c.phone) rows.appendChild(row('phone', 'Call', c.phone, 'tel:' + c.phone.replace(/[^\d+*#]/g, '')));
  if (c.email) rows.appendChild(row('email', 'Email', c.email, 'mailto:' + c.email));

  var hint = document.getElementById('hint');
  document.getElementById('save').addEventListener('click', function () { save(c, hint); });
})();
</script>
</body>
</html>
